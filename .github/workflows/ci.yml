name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDICAL_AUDIT_KB_ANSWER_PROVIDER: fallback
      MEDICAL_AUDIT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/medical_audit_test_ci
      MEDICAL_AUDIT_UNLIMITED_OCR_ENABLED: "false"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: medical_audit_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medical_audit_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The release-guard fixture launches a Python 3.10 subprocess to match the
      # production collector boundary. The following 3.12 step remains primary.
      - name: Install Python 3.10 for release guard fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Set up primary Python 3.12 runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv
        run: python -m pip install uv==0.11.11

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable pgvector extension
        run: |
          uv run python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["MEDICAL_AUDIT_TEST_POSTGRES_URL"])
          with engine.begin() as connection:
              connection.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
          engine.dispose()
          PY

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Mypy
        run: uv run mypy src

      - name: Run Python tests
        run: uv run pytest

  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm web:test

      - name: Run web typecheck
        run: pnpm web:typecheck

      - name: Run web lint
        run: pnpm web:lint

      - name: Build web application
        run: pnpm web:build

      - name: Build public shell export
        run: pnpm web:build:static

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Install uv
        run: python -m pip install uv==0.11.11

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint documentation
        run: pnpm docs:lint
