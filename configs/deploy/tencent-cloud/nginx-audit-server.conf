    # ── HTTPS — audit.lute-tlz-dddd.top (AuditScope medical audit KB) ─────
    server {
        listen 443 ssl;
        http2 on;
        server_name audit.lute-tlz-dddd.top;

        ssl_certificate /etc/letsencrypt/live/lute-tlz-dddd.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lute-tlz-dddd.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # The application accepts a 20 MiB file payload; reserve 1 MiB for
        # multipart/form-data framing so the proxy does not reject valid files.
        client_max_body_size 21m;

        # Next.js static export — serve frontend files directly.
        # Keep HTML uncached during product cutover so browsers stop showing
        # the retired backend pages after a deploy.
        location /_next/static/ {
            root /var/www/audit/current;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /brand/ {
            root /var/www/audit/current;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
        }

        location / {
            root /var/www/audit/current;
            try_files $uri $uri.html /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # The shared ai_video_nginx config defines upstream medical_audit_app
        # as medical_audit_app:8000. Do not add :8000 here, or nginx will fail
        # validation with "upstream may not have port".
        # Production injects the internal X-API-Key in the server-local config;
        # keep the literal secret out of Git.
        location = /health {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
        }

        location = /query {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        location /index/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        location /query/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        location /operation/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        location /audit/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        location /audit-findings/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        location /preview/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        # Static-exported Next.js pages call /api/backend/* because Next.js
        # rewrites do not run after export; strip the frontend-only prefix.
        location /api/backend/ {
            proxy_pass http://medical_audit_app/;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        # Keep a versioned public API prefix for production smoke and callers
        # that should not depend on the backend's root-level route layout.
        location /api/v1/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        # Backend static files (CSS/JS for Jinja2 pages)
        location /static/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
        }

        # Backend page routes that still support data previews and form actions.
        location /pages/preview/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }

        # Retired visible Jinja2 product entrypoints. Keep exact redirects here
        # so old bookmarks and cached links land in the rebuilt frontend.
        location = /pages/chat { return 302 /chat; }
        location = /pages/query { return 302 /documents; }
        location = /pages/review-tasks { return 302 /reports; }
        location = /pages/audit-logs { return 302 /archive; }
        location = /pages/audit-findings { return 302 /findings; }
        location = /pages/index-admin { return 302 /knowledge-base; }

        location = /pages/chat/export {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }
        location /pages/review-tasks/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }
        location /review-tasks/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }
        location /pages/audit-findings/ {
            proxy_pass http://medical_audit_app;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }
    }
