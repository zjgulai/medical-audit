name: medical-audit

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medical_audit_pg
    restart: unless-stopped
    env_file:
      - medical-audit.env
    expose:
      - "5432"
    volumes:
      - medical_audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - medical_audit_internal
    logging: *default-logging

  clamav:
    image: clamav/clamav:stable
    container_name: medical_audit_clamav
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - medical_audit_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --no-summary /etc/hosts >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      medical_audit_internal:
        aliases:
          - clamav
    logging: *default-logging

  app:
    build:
      context: ../../..
      dockerfile: configs/deploy/tencent-cloud/Dockerfile
    image: medical-audit-kb:prod
    container_name: medical_audit_app
    restart: unless-stopped
    env_file:
      - medical-audit.env
    environment:
      MEDICAL_AUDIT_KB_HOST: 0.0.0.0
      MEDICAL_AUDIT_KB_PORT: "8000"
      MEDICAL_AUDIT_KB_API_URL: http://127.0.0.1:8000
      MEDICAL_AUDIT_KB_CONFIG: /app/configs/knowledge-query-engine-dev.yaml
      MEDICAL_AUDIT_KB_DATA_ROOT: /app/data/医保审核前期资料
      MEDICAL_AUDIT_KB_INDEX_ROOT: /app/tmp/knowledge-query-indexes
      MEDICAL_AUDIT_WEB_STATIC_ROOT: /app/web/out
      MEDICAL_AUDIT_ANALYTICS_UPLOAD_ROOT: /app/analytics-uploads
      MEDICAL_AUDIT_DOCUMENT_UPLOAD_ROOT: /app/document-uploads
      MEDICAL_AUDIT_KB_LOG_LEVEL: warning
      MEDICAL_AUDIT_KB_LOAD_BACKEND: "1"
      MEDICAL_AUDIT_KB_DEV_MODE: "0"
      MEDICAL_AUDIT_CONTROLLED_API_AUTH: ${MEDICAL_AUDIT_CONTROLLED_API_AUTH:-enforce}
      KIMI_API_KEY_ENV: KIMI_API_KEY
      KIMI_EMBEDDING_PROVIDER: openai
      KIMI_EMBEDDING_MODEL: kimi-for-coding
      KIMI_EMBEDDING_DIMENSION: "1024"
      KIMI_EMBEDDING_BASE_URL: https://api.kimi.com/coding/v1
      KIMI_EMBEDDING_BATCH_SIZE: "16"
      MEDICAL_AUDIT_AUDIT_LOG_ARCHIVE_ROOT: /app/audit-log-archive
      MEDICAL_AUDIT_AUDIT_LOG_ARCHIVE_REPORT_DIR: /app/audit-reports
      MEDICAL_AUDIT_AUDIT_LOG_SIGNING_SECRET_ENV: MEDICAL_AUDIT_AUDIT_LOG_SIGNING_SECRET
      MEDICAL_AUDIT_AUDIT_LOG_MIN_MANIFEST_COUNT: "0"
      MEDICAL_AUDIT_AUDIT_LOG_ALERT_WEBHOOK_URL_ENV: MEDICAL_AUDIT_AUDIT_LOG_ALERT_WEBHOOK_URL
      MEDICAL_AUDIT_AUDIT_LOG_ALERT_SERVICE: medical-audit
      MEDICAL_AUDIT_AUDIT_LOG_ALERT_TIMEOUT_SECONDS: "10"
      MEDICAL_AUDIT_AUDIT_LOG_SEND_SUCCESS_ALERT: "0"
      MEDICAL_AUDIT_AUDIT_LOG_ALERT_FAIL_ON_ERROR: "0"
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - ../../../data:/app/data:ro
      - ../../../tmp/knowledge-query-indexes:/app/tmp/knowledge-query-indexes
      - ${MEDICAL_AUDIT_ANALYTICS_UPLOAD_ROOT_HOST:-/opt/medical-audit/analytics-uploads}:/app/analytics-uploads
      - ${MEDICAL_AUDIT_DOCUMENT_UPLOAD_ROOT_HOST:-/opt/medical-audit/document-uploads}:/app/document-uploads
      - ${MEDICAL_AUDIT_AUDIT_LOG_ARCHIVE_ROOT_HOST:-/opt/medical-audit/audit-log-archive}:/app/audit-log-archive
      - ${MEDICAL_AUDIT_AUDIT_LOG_ARCHIVE_REPORT_DIR_HOST:-/opt/medical-audit/audit-reports}:/app/audit-reports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      medical_audit_internal:
      lighthouse_ai_video_net:
        aliases:
          - medical_audit_app
    logging: *default-logging

volumes:
  medical_audit_pgdata:
    name: medical_audit_pgdata
  medical_audit_clamav_data:
    name: medical_audit_clamav_data

networks:
  medical_audit_internal:
    name: medical_audit_internal
    driver: bridge
  lighthouse_ai_video_net:
    external: true
