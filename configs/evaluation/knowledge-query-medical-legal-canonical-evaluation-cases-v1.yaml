      - source_collection: medical-insurance-laws
        source_path: 全量法律/docx-converted/审计通用法律法规/01074_中华人民共和国药品管理法2019-08-26.md
        article_or_rule: 第一条
        required_terms: [药品质量, 保障公众用药安全]
