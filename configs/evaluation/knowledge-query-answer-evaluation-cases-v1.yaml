source: human+ai
description: >
  首版 answer-level 评测集，用于验证答案是否严格基于引用、是否覆盖关键术语、
  是否在证据不足时拒答。当前仍为 review，需要医保审核专家复核后转 stable。
cases:
  - case_id: answer-law-shanghai-fund-dedicated-use-001
    question: 上海市医疗保障条例中医疗保障基金是否必须专款专用？
    expected_behavior: answer
    required_evidence_terms: [第二十五条, 专款专用]
    required_answer_terms: [专款专用]
    required_citation_terms: [医疗保障基金, 专款专用]
    forbidden_answer_terms: [自行推断]
    tags: [answerable, law, shanghai, fund]
    filters:
      source_collections: [medical-insurance-laws]

