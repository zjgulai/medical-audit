version: knowledge-base-taxonomy-v1
updated: 2026-07-02
description: >
  Logical namespace taxonomy for the medical audit knowledge base. Secondary
  categories are intended to be the retrieval isolation layer while sharing the
  same physical PostgreSQL/pgvector storage.

primary_categories:
  medical:
    name: 医疗类
    description: 医保审计核心业务知识，默认最高检索优先级。
    secondary_categories:
      medical.legal_regulations:
        name: 法律法规
        description: 医疗、医保、医药、卫生、医院、药品、器械、公共卫生等法规规范。
        priority: 100
        path_keywords: []
        title_keywords:
          - 医疗
          - 医保
          - 医疗保障
          - 医药
          - 医院
          - 卫生健康
          - 医疗卫生
          - 公共卫生
          - 卫生监督
          - 药品
          - 医疗器械
          - 传染病
          - 精神卫生
          - 献血
          - 疫苗
          - 护士
          - 医师
      medical.supervision_rules:
        name: 监管两库
        description: 医疗保障基金智能监管规则库、知识库及批次规则材料。
        priority: 120
        path_keywords:
          - 智能监管“两库”规则和知识点
        title_keywords:
          - 智能监管
          - 规则库
          - 知识库
          - 监管规则
          - 审核规则
      medical.catalog_payment_codes:
        name: 医保目录
        description: 药品目录、DRG、DIP、ICD、手术操作编码和按病种付费资料。
        priority: 120
        path_keywords:
          - 医保目录
        title_keywords:
          - 药品目录
          - 医保目录
          - DRG
          - DIP
          - ICD
          - 手术与操作
          - 按病种
          - 付费
          - 编码
      medical.risk_negative_list:
        name: 风险清单
        description: 医保基金使用负面清单、骗保案例、违规风险和司法案例。
        priority: 120
        path_keywords:
          - 风险负面清单
        title_keywords:
          - 负面清单
          - 骗保
          - 欺诈骗保
          - 违规使用医保基金
          - 医疗保障基金使用
          - 医保基金使用

