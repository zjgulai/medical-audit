data_root: data/医保审核前期资料
index_root: tmp/knowledge-query-indexes
database_url: postgresql+psycopg://medical_audit_kb:medical_audit_kb_dev@localhost:5433/medical_audit_kb
model_provider:
  provider: openai
  api_key_env: OPENAI_API_KEY
  embedding_model: text-embedding-3-small
  rerank_model: null
  chat_model: gpt-4.1-mini
document_upload_governance:
  virus_scan_provider: clamav-sidecar
  dlp_review_provider: ruleset-v1
  redaction_rewrite_enabled: true
  redaction_policy_version: local-ready-profile-v1
  redaction_manual_review_required: true
  governance_audit_event_required: true
document_storage:
  provider: tencent-cos
  cos_bucket: medical-audit-ready-profile-nonprod
  cos_region: ap-guangzhou
  cos_prefix: non-production/ready-profile
  cos_secret_id_env: MEDICAL_AUDIT_DOCUMENT_READY_PROFILE_COS_SECRET_ID
  cos_secret_key_env: MEDICAL_AUDIT_DOCUMENT_READY_PROFILE_COS_SECRET_KEY
  cos_sdk_bootstrap_enabled: true
  signed_url_ttl_seconds: 120
  local_quarantine_retention_days: 7
  object_retention_days: 365
  record_storage_objects: true
source_collection_weights:
  medical-insurance-catalog: 1.25
  supervision-rules-knowledge: 1.35
  risk-negative-list: 1.1
  medical-insurance-laws: 1.0
