services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medical-audit-kb-postgres
    environment:
      POSTGRES_DB: medical_audit_kb
      POSTGRES_USER: medical_audit_kb
      POSTGRES_PASSWORD: medical_audit_kb_dev
    ports:
      - "5433:5432"
    volumes:
      - medical_audit_kb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_audit_kb -d medical_audit_kb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medical_audit_kb_pgdata:
