[project]
name = "medical-audit-kb"
version = "0.1.0"
description = "Knowledge query engine for medical insurance audit materials."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.3",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.8.0",
    "psycopg[binary]>=3.2.1",
    "pypdf>=4.3.1",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0.2",
    "SQLAlchemy>=2.0.32",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
search = [
    "tantivy>=0.22.0",
]

[project.scripts]
medical-audit-kb = "medical_audit_kb.cli:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "types-openpyxl>=3.1.5.20260518",
    "types-PyYAML>=6.0.12.20240808",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_audit_kb"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
